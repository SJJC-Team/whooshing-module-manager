name: Release All Binaries

on:
  release:
    types: [published]

jobs:
  build-and-upload:
    name: Build and Upload All Binaries
    runs-on: ubuntu-24.04
    container: swift:6.0-noble

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and package manager
        working-directory: ./manager
        run: |
          swift build --static-swift-stdlib -c release
          ARCH=$(uname -m)
          OS="ubuntu24.04"
          OUTPUT="manager-${OS}-${ARCH}-static.tar.gz"
          mkdir bundle
          mv .build/release/App bundle/App
          mv pm2.config.json bundle/pm2.config.json
          tar -czvf $OUTPUT -C bundle .
          mv $OUTPUT ../

      - name: Build and package wsm-ctl
        working-directory: ./wsm-ctl
        run: |
          swift build --static-swift-stdlib -c release
          ARCH=$(uname -m)
          OS="ubuntu24.04"
          OUTPUT="wsm-${OS}-${ARCH}-static.tar.gz"
          tar -czvf $OUTPUT -C .build/release wsm
          mv $OUTPUT ../

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.CLWANG_RELEASE_ACCESS }}
        with:
          files: |
            manager-ubuntu24.04-*-static.tar.gz
            wsm-ubuntu24.04-*-static.tar.gz