name: Swift

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
    
    - name: Cache Swift dependencies
      uses: actions/cache@v4.2.0
      with:
        path: |
          ~/.swiftpm
          .build
        key: ${{ runner.os }}-swift-${{ hashFiles('wsm-ctl/Package.swift') }}
        restore-keys: |
          ${{ runner.os }}-swift-

    - name: Build
      run: |
        cd wsm-ctl
        swift build -v
