name: Release Tag Workflow - macOS

on:
  release:
    types: [published]

jobs:
  build-and-upload:
    name: macOS-Release
    strategy:
      matrix:
        include:
          - macos-version: macos-14
            xcode-version: latest-stable
          - macos-version: macos-15
            xcode-version: latest-stable
    runs-on: ${{ matrix.macos-version }}

    steps:
      - name: Select appropriate Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode-version }}
      - name: Check out code
        uses: actions/checkout@v4

      - name: Cache Swift dependencies - Manager
        uses: actions/cache@v4.2.0
        with:
          path: |
            ~/.swiftpm
            manager/.build
          key: ${{ runner.os }}-whooshing.manager-${{ hashFiles('manager/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-whooshing.manager-

      - name: Cache Swift dependencies - Wsm
        uses: actions/cache@v4.2.0
        with:
          path: |
            wsm-ctl/.build
          key: ${{ runner.os }}-wsm-ctl-${{ hashFiles('wsm-ctl/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-wsm-ctl-

      - name: Build and package manager
        working-directory: ./manager
        run: bash ./release.sh xcode ${{ matrix.xcode-version }}

      - name: Build and package wsm-ctl
        working-directory: ./wsm-ctl
        run: bash ./release.sh xcode ${{ matrix.xcode-version }}

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.CLWANG_RELEASE_ACCESS }}
        with:
          files: |
            *.tar.gz
