name: Release Tag Workflow - Ubuntu

on:
  release:
    types: [published]

jobs:
  build-and-upload:
    name: Ubuntu-Release
    runs-on: ${{ matrix.os }}
    container: swift:${{ matrix.swift_version }}

    strategy:
      matrix:
        os: ["ubuntu-22.04", "ubuntu-24.04"]
        swift_version: ["6.0", "6.1"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Swift dependencies - Manager
        uses: actions/cache@v4.2.0
        with:
          path: |
            ~/.swiftpm
            manager/.build
          key: ${{ runner.os }}-whooshing.manager-${{ hashFiles('manager/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-whooshing.manager-

      - name: Cache Swift dependencies - Wsm
        uses: actions/cache@v4.2.0
        with:
          path: |
            wsm-ctl/.build
          key: ${{ runner.os }}-wsm-ctl-${{ hashFiles('wsm-ctl/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-wsm-ctl-

      - name: Build and package manager
        working-directory: ./manager
        run: bash ./release.sh swift ${{ matrix.swift_version }}

      - name: Build and package wsm-ctl
        working-directory: ./wsm-ctl
        run: bash ./release.sh swift ${{ matrix.swift_version }}

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.CLWANG_RELEASE_ACCESS }}
        with:
          files: |
            *.tar.gz
