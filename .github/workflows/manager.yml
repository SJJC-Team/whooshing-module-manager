name: Swift

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
    
    - name: Cache Swift dependencies
      uses: actions/cache@v4.2.0
      with:
        path: |
          ~/.swiftpm
          manager/.build
        key: ${{ runner.os }}-whooshing.manager-${{ hashFiles('manager/Package.swift') }}
        restore-keys: |
          ${{ runner.os }}-whooshing.manager-

    - name: Build
      run: |
        cd manager
        swift build -v
